<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#050505">
  <title>404 // Signal Lost — Pete Junior</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#050505;color:#eef2f5;font-family:Inter,system-ui,sans-serif}body{min-height:100vh;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 70% 20%,rgba(255,30,45,.12),transparent 35%),#050505}.grid{position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);background-size:42px 42px;mask-image:linear-gradient(to bottom,#000,transparent 85%)}main{width:min(760px,calc(100% - 28px));position:relative;border:1px solid #292f34;background:rgba(7,9,11,.94);box-shadow:0 35px 130px #000;padding:clamp(24px,5vw,54px)}.kicker{color:#ff3042;font:800 .68rem ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:1.4px}.code{margin:18px 0 0;font-size:clamp(5rem,20vw,11rem);font-weight:900;line-height:.78;letter-spacing:-.08em;color:#fff;text-shadow:0 0 40px rgba(255,48,66,.12)}h1{margin:24px 0 9px;font-size:clamp(1.7rem,5vw,3.3rem);letter-spacing:-.045em}p{max-width:590px;color:#859098;line-height:1.7;font-size:.95rem}.status{display:flex;align-items:center;gap:7px;margin-top:18px;color:#61ff96;font:800 .65rem ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.8px}.status i{width:7px;height:7px;border-radius:50%;background:#61ff96;box-shadow:0 0 12px #61ff96}.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:27px}.actions a{min-height:42px;display:inline-flex;align-items:center;padding:0 14px;border:1px solid #ff3042;background:#ff3042;color:#050607;text-decoration:none;font:900 .65rem ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.65px}.actions a.secondary{border-color:#343c43;background:#0a0d0f;color:#aab4bb}.actions a:hover,.actions a:focus-visible{outline:0;box-shadow:0 0 0 3px rgba(255,48,66,.18)}footer{margin-top:34px;padding-top:12px;border-top:1px solid #20262b;color:#515d65;font:800 .55rem ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.8px}@media(max-width:520px){main{padding:24px}.actions a{width:100%;justify-content:center}}@media(prefers-reduced-motion:no-preference){.status i{animation:pulse 1.8s ease-in-out infinite}@keyframes pulse{50%{opacity:.45}}}
  </style>
</head>
<body>
  <div class="grid" aria-hidden="true"></div>
  <main>
    <div class="kicker">PJ CORE // ROUTE FAILURE</div>
    <div class="code" aria-hidden="true">404</div>
    <h1>SIGNAL LOST.</h1>
    <p>The route you requested does not exist, moved, or was never published. The main PJ CORE system is still online.</p>
    <div class="status"><i></i> CORE ONLINE // RECOVERY AVAILABLE</div>
    <div class="actions">
      <a href="/">RETURN TO PJ CORE →</a>
      <a class="secondary" href="/#projects">VIEW PROJECTS</a>
      <a class="secondary" href="/#contact">CONTACT</a>
    </div>
    <footer>PJ CORE // ERROR HANDLER // BUILD 2026.10</footer>
  </main>
</body>
</html>
